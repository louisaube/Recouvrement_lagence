# Les 33 questions ouvertes de la salle blanche (specifications/socle/99-questions-ouvertes.md), converties au format 3.1.
# Classement d'origine (tri manuel du 8 octobre) : 12 sans effet sur la recette, 15 où le défaut suffit, le reste au propriétaire.
# Sert au critère d'acceptation 1 de l'étape d'arbitrage (.cuisine/tests/arbitrage/run.sh).

# ── Plateforme ──
- id: Q-PLAT-01
  titre: Forme complète du corps d'erreur
  regles: [rule-foundation-api-failure-handling]
  effet_recette: oui
  decideur: defaut
  observable: oui
  situation: "Un client envoie un corps invalide à une route quelconque."
  options:
    - {code: A, libelle: "status, code, message (et details en validation)", cout: leger, resultat: "Le corps ne contient que status, code, message, details.", test: {route: "POST /users", entree: "corps invalide", attendu: "400 api.validation.incoming_failed avec details"}}
    - {code: B, libelle: "Ajouter horodatage et chemin", cout: leger, resultat: "Le corps contient aussi timestamp et path.", test: {route: "POST /users", entree: "corps invalide", attendu: "400 avec timestamp et path"}}
  defaut: A
- id: Q-PLAT-02
  titre: Identifiant de corrélation
  regles: [rule-foundation-api-failure-handling]
  effet_recette: oui
  decideur: defaut
  observable: oui
  situation: "Un client appelle GET /server/health-check."
  options:
    - {code: A, libelle: "En-tête X-Request-Id généré par le serveur", cout: leger, resultat: "La réponse porte X-Request-Id, un UUID.", test: {route: "GET /server/health-check", entree: "aucune", attendu: "200 avec en-tête X-Request-Id"}}
    - {code: B, libelle: "Pas d'identifiant", cout: leger, resultat: "Aucun en-tête de corrélation.", test: {route: "GET /server/health-check", entree: "aucune", attendu: "200 sans en-tête X-Request-Id"}}
  defaut: A
- id: Q-PLAT-03
  titre: Chemin du document OpenAPI servi
  regles: [rule-foundation-home-replaceable]
  effet_recette: non
  decideur: defaut
  observable: non
  options:
    - {code: A, libelle: "/api-json hors production", cout: leger, resultat: "Document servi en développement et en recette seulement."}
    - {code: B, libelle: "/api-json partout", cout: leger, resultat: "Document servi aussi en production."}
  defaut: A
- id: Q-PLAT-04
  titre: Taille maximale d'un corps JSON
  regles: [rule-foundation-api-failure-handling]
  effet_recette: oui
  decideur: defaut
  observable: oui
  situation: "Un client envoie un corps JSON de 2 Mio."
  options:
    - {code: A, libelle: "1 Mio, 413", cout: leger, resultat: "Refus 413 api.payload_too_large.", test: {route: "POST /users", entree: "corps de 2 Mio", attendu: "413 api.payload_too_large"}}
    - {code: B, libelle: "10 Mio", cout: leger, resultat: "Corps accepté puis validé.", test: {route: "POST /users", entree: "corps de 2 Mio", attendu: "400 api.validation.incoming_failed"}}
  defaut: A
- id: Q-PLAT-05
  titre: Refus d'une route non déclarée
  regles: [rule-foundation-api-failure-handling]
  effet_recette: oui
  decideur: defaut
  observable: non
  options:
    - {code: A, libelle: "Le serveur refuse de démarrer", cout: leger, resultat: "Une route sans déclaration empêche le démarrage."}
    - {code: B, libelle: "403 à l'exécution", cout: leger, resultat: "La route répond 403 security.access_denied."}
  defaut: A
- id: Q-PLAT-06
  titre: Corps d'une réponse 404 de route inexistante
  regles: [rule-foundation-api-failure-handling]
  effet_recette: oui
  decideur: defaut
  observable: oui
  situation: "Un visiteur appelle GET /inexistant."
  options:
    - {code: A, libelle: "404 api.route_not_found pour tous", cout: leger, resultat: "Le visiteur reçoit 404.", test: {route: "GET /inexistant", entree: "sans jeton", attendu: "404 api.route_not_found"}}
    - {code: B, libelle: "401 pour un visiteur", cout: leger, resultat: "Le visiteur reçoit 401.", test: {route: "GET /inexistant", entree: "sans jeton", attendu: "401 security.unauthenticated"}}
  defaut: A
- id: Q-PLAT-07
  titre: Clés inconnues hors routes PATCH
  regles: [rule-foundation-scope-definition]
  effet_recette: oui
  decideur: defaut
  observable: oui
  situation: "Un administrateur crée un périmètre avec une clé en trop."
  options:
    - {code: A, libelle: "Ignorées", cout: leger, resultat: "Périmètre créé, clé ignorée.", test: {route: "POST /scopes", entree: "corps valide + clé foo", attendu: "201"}}
    - {code: B, libelle: "Refusées partout", cout: leger, resultat: "Création refusée.", test: {route: "POST /scopes", entree: "corps valide + clé foo", attendu: "400 api.validation.incoming_failed"}}
  defaut: A
- id: Q-PLAT-08
  titre: Contenu de services dans le point de santé
  regles: [rule-foundation-api-unreachable]
  effet_recette: non
  decideur: defaut
  observable: non
  options:
    - {code: A, libelle: "Base de données seule", cout: leger, resultat: "services.postgres seulement."}
    - {code: B, libelle: "Tous les services", cout: leger, resultat: "Un état par dépendance."}
  defaut: A
- id: Q-PLAT-09
  titre: Provenance divergente de trois règles
  regles: [rule-foundation-list-pagination, rule-foundation-admin-nav, rule-foundation-admin-screens-guard]
  effet_recette: non
  decideur: defaut
  observable: non
  options:
    - {code: A, libelle: "(inferred)", cout: leger, resultat: "Provenance déduite."}
    - {code: B, libelle: "(user)", cout: leger, resultat: "Provenance demandée."}
  defaut: A

# ── Authentification ──
- id: Q-AUTH-01
  titre: Connexion sans Origin et sans jeton demandé
  regles: [rule-foundation-session-persists]
  effet_recette: oui
  decideur: defaut
  observable: oui
  situation: "Un client sans en-tête Origin se connecte sans demander de jeton."
  options:
    - {code: A, libelle: "400 security.invalid_origin", cout: leger, resultat: "Refus explicite.", test: {route: "POST /auth/login", entree: "sans Origin, returnToken absent", attendu: "400 security.invalid_origin"}}
    - {code: B, libelle: "Jeton renvoyé", cout: leger, resultat: "Le serveur renvoie un jeton.", test: {route: "POST /auth/login", entree: "sans Origin, returnToken absent", attendu: "201 avec token"}}
  defaut: A
- id: Q-AUTH-02
  titre: Provenance des règles de la recette d'origine
  regles: [rule-foundation-login-single-error]
  effet_recette: non
  decideur: defaut
  observable: non
  options:
    - {code: A, libelle: "(user)", cout: leger, resultat: "Règles demandées."}
    - {code: B, libelle: "(inferred)", cout: leger, resultat: "Règles déduites."}
  defaut: A
- id: Q-AUTH-03
  titre: Révocation du jeton à la déconnexion
  regles: [rule-foundation-logout, rule-foundation-session-expired]
  effet_recette: oui
  decideur: proprietaire
  observable: oui
  situation: "Un utilisateur se déconnecte, puis son ancien jeton est réutilisé."
  options:
    - {code: A, libelle: "Jeton sans état, pas de révocation", cout: leger, resultat: "L'ancien jeton reste valable jusqu'à son expiration.", test: {route: "GET /auth/current-user", entree: "jeton émis avant la déconnexion", attendu: "200 avec user"}}
    - {code: B, libelle: "Révocation côté serveur", cout: lourd, ouvre: [stockage des révocations, purge], resultat: "L'ancien jeton est refusé.", test: {route: "GET /auth/current-user", entree: "jeton émis avant la déconnexion", attendu: "401 security.invalid_token"}}
  defaut: A
- id: Q-AUTH-04
  titre: Rôle figé dans le jeton
  regles: [rule-foundation-session-expired, rule-foundation-user-edit-scope]
  effet_recette: oui
  decideur: proprietaire
  observable: oui
  situation: "Un administrateur est rétrogradé en utilisateur, puis réutilise son jeton."
  options:
    - {code: A, libelle: "Rôle lu dans le jeton", cout: leger, resultat: "Il garde ses droits jusqu'à la reconnexion.", test: {route: "GET /users", entree: "jeton émis avant la rétrogradation", attendu: "200"}}
    - {code: B, libelle: "Rôle relu en base", cout: leger, resultat: "Il perd ses droits immédiatement.", test: {route: "GET /users", entree: "jeton émis avant la rétrogradation", attendu: "403 security.access_denied"}}
  defaut: A
- id: Q-AUTH-05
  titre: Studio et API sur des origines distinctes
  regles: [rule-foundation-protected-redirect]
  effet_recette: non
  decideur: defaut
  observable: non
  options:
    - {code: A, libelle: "Même site seulement", cout: leger, resultat: "Cookie SameSite=Strict."}
    - {code: B, libelle: "Origines distinctes", cout: lourd, resultat: "Cookie SameSite=None et CORS élargi."}
  defaut: A

# ── Comptes ──
- id: Q-COMPTES-01
  titre: Mot de passe borné en caractères ou en octets
  regles: [rule-foundation-user-create-fields]
  effet_recette: oui
  decideur: defaut
  observable: oui
  situation: "Un administrateur crée un compte avec un mot de passe de 72 caractères accentués."
  options:
    - {code: A, libelle: "Borne en caractères", cout: leger, resultat: "Compte créé ; bcrypt tronque au-delà de 72 octets.", test: {route: "POST /users", entree: "mot de passe de 72 caractères accentués", attendu: "201"}}
    - {code: B, libelle: "Borne en octets", cout: leger, resultat: "Création refusée.", test: {route: "POST /users", entree: "mot de passe de 72 caractères accentués", attendu: "400 api.validation.incoming_failed"}}
  defaut: A
- id: Q-COMPTES-02
  titre: Critère de validité d'une adresse e-mail
  regles: [rule-foundation-user-create-fields, rule-foundation-import-users-email]
  effet_recette: oui
  decideur: defaut
  observable: oui
  situation: "Un administrateur crée un compte avec l'adresse a@b."
  options:
    - {code: A, libelle: "Domaine avec un point", cout: leger, resultat: "Adresse refusée.", test: {route: "POST /users", entree: "email a@b", attendu: "400 api.validation.incoming_failed"}}
    - {code: B, libelle: "Une arobase suffit", cout: leger, resultat: "Compte créé.", test: {route: "POST /users", entree: "email a@b", attendu: "201"}}
  defaut: A
- id: Q-COMPTES-03
  titre: Écran pour les utilisateurs ordinaires
  regles: [rule-foundation-home-welcome]
  effet_recette: non
  decideur: defaut
  observable: non
  options:
    - {code: A, libelle: "Aucun dans cette version", cout: leger, resultat: "Accueil seulement."}
    - {code: B, libelle: "Écran « Mon compte »", cout: lourd, resultat: "Un écran de plus."}
  defaut: A

# ── Groupes et périmètres ──
- id: Q-PERIM-01
  titre: Une ligne rattachée à plusieurs périmètres
  regles: [rule-foundation-scope-row-filter]
  effet_recette: non
  decideur: defaut
  observable: non
  options:
    - {code: A, libelle: "Un seul périmètre par ligne", cout: leger, resultat: "Modèle simple."}
    - {code: B, libelle: "Plusieurs périmètres", cout: lourd, resultat: "Table de liaison."}
  defaut: A
- id: Q-PERIM-02
  titre: Preuve de la règle par ligne
  regles: [rule-foundation-scope-fail-closed]
  effet_recette: non
  decideur: defaut
  observable: non
  options:
    - {code: A, libelle: "Tests du socle sur une table d'essai", cout: leger, resultat: "Preuve par les tests de l'API."}
    - {code: B, libelle: "Route d'essai exposée", cout: leger, resultat: "Preuve par la recette."}
  defaut: A

# ── Journal d'audit ──
- id: Q-AUDIT-01
  titre: Accord de « 0 » dans les résumés
  regles: [rule-foundation-audit-french-screen]
  effet_recette: oui
  decideur: defaut
  observable: non
  options:
    - {code: A, libelle: "Singulier pour 0 et 1", cout: leger, resultat: "« 0 compte »."}
    - {code: B, libelle: "Pluriel pour 0", cout: leger, resultat: "« 0 comptes »."}
  defaut: A
- id: Q-AUDIT-02
  titre: Verbe affiché pour l'import
  regles: [rule-foundation-audit-french-screen]
  effet_recette: oui
  decideur: defaut
  observable: non
  options:
    - {code: A, libelle: "« Import »", cout: leger, resultat: "Libellé français."}
    - {code: B, libelle: "Suffixe brut", cout: leger, resultat: "« import-confirm »."}
  defaut: A
- id: Q-AUDIT-03
  titre: Nom de la base de recette
  regles: [rule-foundation-audit-db-append-only]
  effet_recette: non
  decideur: defaut
  observable: non
  options:
