  defaut: A

# ── Import ──
- id: Q-IMPORT-01
  titre: Comptes importés sans possibilité de connexion
  regles: [rule-foundation-import-users-no-password]
  effet_recette: oui
  decideur: proprietaire
  observable: oui
  situation: "Un salarié importé ouvre l'application et tente de se connecter."
  options:
    - {code: A, libelle: "Laisser ainsi jusqu'à une future fonction d'invitation", cout: leger, resultat: "Connexion refusée ; il attend une future fonction d'invitation.", test: {route: "POST /auth/login", entree: "compte importé, mot de passe quelconque", attendu: "401 security.invalid_credentials"}}
    - {code: B, libelle: "Invitation par e-mail avec lien de définition du mot de passe", cout: lourd, ouvre: [durée du lien, déclencheur de l'invitation, renvoi, sous-traitant d'envoi], resultat: "Il a reçu un lien valable 72 h, choisit son mot de passe et se connecte.", test: {route: "POST /auth/invitations/accept", entree: "jeton d'invitation valide, mot de passe conforme", attendu: "200, puis connexion acceptée"}}
  defaut: A
- id: Q-IMPORT-02
  titre: Une entrée de journal par import ou par compte
  regles: [rule-foundation-import-audited]
  effet_recette: oui
  decideur: defaut
  observable: oui
  situation: "Un administrateur confirme l'import de 3 comptes."
  options:
    - {code: A, libelle: "Une entrée par import", cout: leger, resultat: "Une ligne « Import de comptes ».", test: {route: "GET /audit-logs", entree: "après confirmation", attendu: "200 avec 1 entrée users:import-confirm"}}
    - {code: B, libelle: "Une entrée par compte", cout: leger, resultat: "Trois lignes users:create.", test: {route: "GET /audit-logs", entree: "après confirmation", attendu: "200 avec 3 entrées users:create"}}
  defaut: A
- id: Q-IMPORT-03
  titre: Entrée chiffrée dans un xlsx
  regles: [rule-foundation-import-trapped-files-refused]
  effet_recette: oui
  decideur: defaut
  observable: oui
  situation: "Un administrateur envoie un classeur protégé par mot de passe."
  options:
    - {code: A, libelle: "import.unsafe_archive", cout: leger, resultat: "Refus pour archive dangereuse.", test: {route: "POST /users/imports/preview", entree: "classeur chiffré", attendu: "400 import.unsafe_archive"}}
    - {code: B, libelle: "import.invalid_file_type", cout: leger, resultat: "Refus pour type invalide.", test: {route: "POST /users/imports/preview", entree: "classeur chiffré", attendu: "400 import.invalid_file_type"}}
  defaut: A
- id: Q-IMPORT-04
  titre: CSV sans ligne d'en-tête
  regles: [rule-foundation-import-header-matching]
  effet_recette: oui
  decideur: defaut
  observable: oui
  situation: "Un administrateur envoie un CSV de données sans en-tête."
  options:
    - {code: A, libelle: "import.missing_columns", cout: leger, resultat: "Refus, colonnes manquantes nommées.", test: {route: "POST /users/imports/preview", entree: "CSV sans en-tête", attendu: "400 import.missing_columns"}}
    - {code: B, libelle: "import.invalid_file_type", cout: leger, resultat: "Refus, type invalide.", test: {route: "POST /users/imports/preview", entree: "CSV sans en-tête", attendu: "400 import.invalid_file_type"}}
  defaut: A
- id: Q-IMPORT-05
  titre: Confirmation d'un aperçu sans ligne valide
  regles: [rule-foundation-import-confirm-needs-valid-rows]
  effet_recette: oui
  decideur: defaut
  observable: oui
  situation: "Un administrateur confirme un aperçu dont aucune ligne n'est valide."
  options:
    - {code: A, libelle: "Autorisée par l'API, bloquée par l'écran", cout: leger, resultat: "Confirmation acceptée, zéro compte créé.", test: {route: "POST /users/imports/{importId}/confirm", entree: "aperçu sans ligne valide", attendu: "200 avec created 0"}}
    - {code: B, libelle: "Refusée par l'API", cout: leger, resultat: "Confirmation refusée.", test: {route: "POST /users/imports/{importId}/confirm", entree: "aperçu sans ligne valide", attendu: "400 import.nothing_to_import"}}
  defaut: A
- id: Q-IMPORT-06
  titre: Analyses d'import simultanées
  regles: [rule-foundation-import-large-files]
  effet_recette: oui
  decideur: proprietaire
  observable: non
  options:
    - {code: A, libelle: "Pas de limite", cout: leger, resultat: "Chaque analyse prend jusqu'à 100 Mio de disque temporaire ; dix analyses simultanées en prennent un Gio."}
    - {code: B, libelle: "Deux analyses par instance", cout: leger, ouvre: [code d'erreur de la troisième, durée d'attente], resultat: "La troisième analyse simultanée est refusée."}
  defaut: A
- id: Q-IMPORT-07
  titre: 413 ou 400 pour un fichier trop gros
  regles: [rule-foundation-import-limits]
  effet_recette: oui
  decideur: defaut
  observable: oui
  situation: "Un administrateur envoie un fichier de 101 Mio."
  options:
    - {code: A, libelle: "413", cout: leger, resultat: "Refus 413.", test: {route: "POST /users/imports/preview", entree: "fichier de 101 Mio", attendu: "413 import.file_too_large"}}
    - {code: B, libelle: "400", cout: leger, resultat: "Refus 400.", test: {route: "POST /users/imports/preview", entree: "fichier de 101 Mio", attendu: "400 import.file_too_large"}}
  defaut: A
- id: Q-IMPORT-08
  titre: Constantes de limites
  regles: [rule-foundation-import-archive-limits]
  effet_recette: non
  decideur: defaut
  observable: non
  options:
    - {code: A, libelle: "Conservées", cout: leger, resultat: "100 Mio, 1 000 000 lignes, 2 h."}
    - {code: B, libelle: "Réduites", cout: leger, resultat: "Limites plus basses."}
  defaut: A

